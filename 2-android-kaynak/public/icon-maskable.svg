<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded app square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner glowing drop shape -->
  <g filter="url(#shadow)">
    <path d="M256 90 C256 90 140 236 140 330 A116 116 0 0 0 372 330 C372 236 256 90 256 90 Z" 
          fill="url(#dropGrad)" />
  </g>

  <!-- Pulse / ECG inside the drop -->
  <path d="M195 335 L230 335 L245 275 L267 385 L285 305 L298 345 L320 335" 
        stroke="#0d9488" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Mini glowing highlight -->
  <ellipse cx="215" cy="245" rx="16" ry="32" transform="rotate(-30 215 245)" fill="#ffffff" opacity="0.6" />
</svg>
