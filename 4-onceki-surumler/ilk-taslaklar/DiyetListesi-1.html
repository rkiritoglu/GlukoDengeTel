<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Şeker & Egzersiz">
  <title>Diyabet & Egzersiz Takipçisi</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-inner: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --warning: #f59e0b;
      --danger: #ef4444;
      --blue: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; -webkit-tap-highlight-color: transparent; }
    header { background: #1e293be6; backdrop-filter: blur(8px); padding: 14px 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .badge { background: #064e3b; color: #6ee7b7; padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    
    .day-selector { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
    .day-selector::-webkit-scrollbar { display: none; }
    .day-btn { background: var(--card); border: 1px solid #334155; color: var(--muted); padding: 8px 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .day-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .container { padding: 0 16px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid #334155; }
    .card h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; color: #e2e8f0; }

    /* Sugar input */
    .sugar-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .input-box { background: var(--card-inner); border: 1px solid #475569; border-radius: 10px; color: #fff; padding: 10px 12px; font-size: 0.9rem; flex: 1; outline: none; }
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
    .btn:active { transform: scale(0.97); }

    /* Task list */
    .task { display: flex; align-items: flex-start; gap: 12px; background: var(--card-inner); padding: 12px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
    .task.done { opacity: 0.55; text-decoration: line-through; }
    .task-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; margin-top: 2px; flex-shrink: 0; }
    .task.done .task-check { background: var(--accent); border-color: var(--accent); }
    .task.done .task-check::after { content: "✓"; color: #fff; font-size: 14px; font-weight: bold; }
    .task-body { flex: 1; }
    .task-title { font-size: 0.88rem; font-weight: 600; color: #f1f5f9; }
    .task-desc { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    /* Progress bar */
    .progress-bar-bg { background: #334155; border-radius: 999px; height: 8px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s; }

    /* Filter buttons for Chart */
    .filter-group { display: flex; gap: 6px; margin-bottom: 12px; }
    .filter-btn { background: var(--card-inner); border: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .filter-btn.active { background: var(--blue); color: #000; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Diyabet & Egzersiz Takibi</h1>
      <span style="font-size: 0.75rem; color: var(--muted);" id="currentDateText"></span>
    </div>
    <span class="badge" id="completionBadge">%0 Tamamlandı</span>
  </header>

  <div class="day-selector" id="daySelector"></div>

  <div class="container">

    <!-- Kan Şekeri Giriş Kartı -->
    <div class="card">
      <h2>🩸 Kan Şekeri Girişi <span id="latestSugar" style="font-size:0.8rem; font-weight:normal; color:var(--blue);"></span></h2>
      <div class="sugar-row">
        <input type="number" id="sugarInput" class="input-box" placeholder="Örn: 170" inputmode="numeric">
        <select id="sugarType" class="input-box" style="flex-wrap: wrap;">
          <option value="Açlık">Açlık</option>
          <option value="Tokluk">Tokluk</option>
        </select>
        <input type="time" id="sugarTime" class="input-box" style="flex:0.8;">
  

        <button class="btn" onclick="saveSugar()">Kaydet</button>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Günlük Görevler -->
    <div class="card">
      <h2>📋 Günün Programı <span style="font-size:0.75rem; color:var(--muted);" id="selectedDayName"></span></h2>
      <div id="taskList"></div>
    </div>

    <!-- Grafik ve Rapor Kartı -->
    <div class="card">
      <h2>📊 İlerleme ve Şeker Grafiği</h2>
      <div class="filter-group">
        <button class="filter-btn active" onclick="setChartFilter('all')">Tümü</button>
        <button class="filter-btn" onclick="setChartFilter('month')">Aylık (30 Gün)</button>
        <button class="filter-btn" onclick="setChartFilter('week')">Haftalık (7 Gün)</button>
        <button class="filter-btn" onclick="setChartFilter('day')">Günlük</button>
      </div>
      <div style="position: relative; height: 230px;">
        <canvas id="healthChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    const days = [
      { id: 0, name: "Pazartesi", short: "Pzt" },
      { id: 1, name: "Salı", short: "Sal" },
      { id: 2, name: "Çarşamba", short: "Çar" },
      { id: 3, name: "Perşembe", short: "Per" },
      { id: 4, name: "Cuma", short: "Cum" },
      { id: 5, name: "Cumartesi", short: "Cmt" },
      { id: 6, name: "Pazar", short: "Paz" }
    ];

    const weeklyProgram    let selectedDay = 0;
    let chartInstance = null;
    let currentFilter = 'all';

    // Local Storage helpers
    function getStoredData(key, fallback) {
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : fallback;
    }
    function setStoredData(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    // Default historical sugar readings if empty
    let sugarHistory = getStoredData('sugar_history', [
      { date: "10 Eki", value: 170, type: "Açlık", completion: 65 },
      { date: "12 Eki", value: 162, type: "Tokluk", completion: 80 },
      { date: "14 Eki", value: 154, type: "Açlık", completion: 85 },
      { date: "16 Eki", value: 145, type: "Açlık", completion: 90 },
      { date: "18 Eki", value: 138, type: "Tokluk", completion: 100 },
      { date: "Bugün", value: 170, type: "Açlık", completion: 70 }
    ]);

    let tasksCompleted = getStoredData('tasks_completed', {});

    function init() {
      // Set today's date text
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('currentDateText').innerText = now.toLocaleDateString('tr-TR', options);

      // Map js day (0 is sunday) to our monday-based list
      const jsDay = now.getDay();
      selectedDay = jsDay === 0 ? 6 : jsDay - 1;

      renderDaySelector();
      renderTasks();
      initChart();
      updateLatestSugarBadge();
    }

    function renderDaySelector() {
      const container = document.getElementById('daySelector');
      container.innerHTML = '';
      days.forEach(d => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${d.id === selectedDay ? 'active' : ''}`;
        btn.innerText = d.name;
        btn.onclick = () => {
          selectedDay = d.id;
          renderDaySelector();
          renderTasks();
        };
        container.appendChild(btn);
      });
      document.getElementById('selectedDayName').innerText = `(${days[selectedDay].name})`;
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      const dayTasks = weeklyProgram[selectedDay] || [];
      const dayState = tasksCompleted[selectedDay] || {};

      let completedCount = 0;

      dayTasks.forEach(task => {
        const isDone = !!dayState[task.id];
        if (isDone) completedCount++;

        const div = document.createElement('div');
        div.className = `task ${isDone ? 'done' : ''}`;
        div.onclick = () => toggleTask(task.id);
        div.innerHTML = `
          <div class="task-check"></div>
          <div class="task-body">
            <div class="task-title">${task.title}</div>
            <div class="task-desc">${task.desc}</div>
          </div>
        `;
        list.appendChild(div);
      });

      const percent = dayTasks.length ? Math.round((completedCount / dayTasks.length) * 100) : 0;
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('completionBadge').innerText = `%${percent} Tamamlandı`;
    }

    function toggleTask(taskId) {
      if (!tasksCompleted[selectedDay]) tasksCompleted[selectedDay] = {};
      tasksCompleted[selectedDay][taskId] = !tasksCompleted[selectedDay][taskId];
      setStoredData('tasks_completed', tasksCompleted);
      renderTasks();
    }

    function saveSugar() {
  const valInput = document.getElementById('sugarInput');
  const typeInput = document.getElementById('sugarType');
  const timeInput = document.getElementById('sugarTime'); // Saat elementi eklendi
  const val = parseInt(valInput.value);

  if (!val || isNaN(val)) {
    alert('Lütfen geçerli bir şeker değeri girin.');
    return;
  }

  const now = new Date();
  
  // Kullanıcı saat girmediyse, o anki güncel saati otomatik al
  let timeValue = timeInput.value;
  if (!timeValue) {
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    timeValue = `${hours}:${minutes}`;
  }

  // Tarih ve saati birleştirerek grafikte ve geçmişte gösterilecek etiketi oluştur
  const dateLabel = `${now.getDate()} ${now.toLocaleString('tr-TR', { month: 'short' })} ${timeValue}`;

  // Günlük görev tamamlama yüzdesini hesapla
  const dayTasks = weeklyProgram[selectedDay] || [];
  const dayState = tasksCompleted[selectedDay] || {};
  const completed = Object.values(dayState).filter(Boolean).length;
  const compPercent = dayTasks.length ? Math.round((completed / dayTasks.length) * 100) : 0;

  // Yeni kaydı geçmişe ekle
  sugarHistory.push({
    date: dateLabel,
    value: val,
    type: typeInput.value,
    completion: compPercent
  });

  setStoredData('sugar_history', sugarHistory);
  
  // Girdileri temizle ve ekranı güncelle
  valInput.value = '';
  timeInput.value = ''; 
  updateLatestSugarBadge();
  updateChartData();
}
    function updateLatestSugarBadge() {
      if (sugarHistory.length > 0) {
        const last = sugarHistory[sugarHistory.length - 1];
        document.getElementById('latestSugar').innerText = `Son: ${last.value} mg/dL (${last.type})`;
      }
    }

    function setChartFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      updateChartData();
    }

    function getFilteredData() {
      let data = [...sugarHistory];
      if (currentFilter === 'day') {
        data = data.slice(-3); // Son 3 ölçüm
      } else if (currentFilter === 'week') {
        data = data.slice(-7);
      } else if (currentFilter === 'month') {
        data = data.slice(-30);
      }
      return data;
    }

    function initChart() {
      const ctx = document.getElementById('healthChart').getContext('2d');
      const filtered = getFilteredData();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: filtered.map(d => d.date),
          datasets: [
            {
              label: 'Şeker (mg/dL)',
              data: filtered.map(d => d.value),
              borderColor: '#ef4444',
              backgroundColor: 'rgba(239, 68, 68, 0.2)',
              yAxisID: 'ySugar',
              tension: 0.35,
              pointRadius: 4,
              borderWidth: 2
            },
            {
              label: 'Program Tamamlama (%)',
              data: filtered.map(d => d.completion),
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.15)',
              yAxisID: 'yComp',
              type: 'bar',
              borderRadius: 6
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: '#94a3b8', font: { size: 10 } } }
          },
          scales: {
            x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { display: false } },
            ySugar: {
              type: 'linear',
              position: 'left',
              ticks: { color: '#ef4444', font: { size: 10 } },
              grid: { color: '#334155' },
              suggestedMin: 80,
              suggestedMax: 200
            },
            yComp: {
              type: 'linear',
              position: 'right',
              ticks: { color: '#10b981', font: { size: 10 }, callback: v => '%' + v },
              grid: { display: false },
              min: 0,
              max: 100
            }
          }
        }
      });
    }

    function updateChartData() {
      const filtered = getFilteredData();
      chartInstance.data.labels = filtered.map(d => d.date);
      chartInstance.data.datasets[0].data = filtered.map(d => d.value);
      chartInstance.data.datasets[1].data = filtered.map(d => d.completion);
      chartInstance.update();
    }

    window.onload = init;
  </script>
</body>
</html>
